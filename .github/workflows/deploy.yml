# Push to main → test → update the Supabase database → build and publish the web app.
#
# Repository settings → Secrets and variables → Actions:
#   Variables:  SUPABASE_URL (https://<ref>.supabase.co), SUPABASE_ANON_KEY (the anon public key), SUPABASE_PROJECT_ID (<ref>)
#   Secrets:    SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access tokens), SUPABASE_DB_PASSWORD (the project's database password)
#   Hosting the web app (pick one):
#     GitHub Pages — variable USE_GITHUB_PAGES = true, and Settings → Pages → Source: GitHub Actions
#                    (free for public repositories; private ones need a paid GitHub plan)
#     Cloudflare Pages (free, works with private repositories):
#               secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and variable CLOUDFLARE_PAGES_PROJECT
# Steps whose settings are missing are skipped, so the first push works before anything is configured.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.changed.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The desktop installers (Windows + Mac) take most of the build minutes — Mac minutes count 10×, Windows 2× — so they
      # are built only on demand: Actions → deploy → "Run workflow". A push deploys the tests, database and website only;
      # the website keeps offering the Signer installer last published on the "desktop-app" release.
      - name: Build the desktop installers this time?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signer installer not rebuilt (run the workflow by hand to build it) — the app keeps offering the current one"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r signer/requirements.txt
      # a software token stands in for the USB token in the Signer's tests
      - run: sudo apt-get install -y softhsm2 >/dev/null
      - run: python -m unittest discover tests

  # Business journeys through the screens in a real browser (tests/e2e/run.js): purchasing, sales, stock, budget, drafts,
  # permissions and a phone turned sideways. Runs beside the tests; it does not hold back the deploy.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30          # the browser download can be slow; the journeys take about two minutes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install the browser (Playwright, pinned)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node tests/e2e/run.js
      - name: Keep the screenshots of failed steps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/out/
          retention-days: 7

  database:
    needs: test
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Supabase only needs updating when something under supabase/ changed (or when run by hand), so an expired
      # access token only matters on those rare pushes.
      # Compared with the last release that went through (not only the previous push), so database changes in a
      # release that failed its tests are still applied by the next one.
      - name: Did the database or its functions change?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=1" \
                   --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          [ -n "$before" ] || before="${{ github.event.before }}"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before" 2>/dev/null || git diff --name-only "$before" "${{ github.sha }}" | grep -q '^supabase/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changes under supabase/ — database and functions left as they are"
          fi
      - uses: supabase/setup-cli@v3
        if: steps.changed.outputs.run == 'true' && env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_ID != ''
        with:
          version: 3.0.0      # pinned: a new major version changed these commands once; move up on purpose, after checking
      - name: Apply database migrations
        if: steps.changed.outputs.run == 'true' && env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_ID != ''
        run: |
          set -o pipefail
          { supabase link --project-ref "$PROJECT_ID" &&
            supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes; } 2>&1 | tee out.txt || {
            if grep -qi "unauthorized" out.txt; then
              echo "::error title=Supabase access token expired or revoked::Create a new one (supabase.com → your avatar → Account preferences → Access Tokens), put it in the repository secret SUPABASE_ACCESS_TOKEN, then re-run this workflow."
            else
              echo "::error title=Database migrations::$(tail -c 1500 out.txt | tr '\n' ' ')"
            fi
            exit 1; }
      # Every release adds a draft of its patch notes (from the commit messages since the previous release) for the owner
      # console and the support desk to review, edit and publish; customers only ever see what was published.
      - name: Patch notes draft for this release
        if: github.event_name == 'push' && env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_ID != ''
        run: |
          before="${{ steps.changed.outputs.before }}"
          git cat-file -e "$before" 2>/dev/null || before=""
          python3 packaging/patch_note_draft.py "$before" "${{ github.sha }}" > note.sql
          python3 -c 'import json,sys; print(json.dumps({"query": open("note.sql").read()}))' > note.json
          code=$(curl -sS -o out.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_ID/database/query" \
                 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @note.json || echo 000)
          if [ "${code:0:1}" != "2" ]; then
            echo "::warning title=Patch notes draft not added::HTTP $code $(head -c 300 out.txt) — write it by hand in the owner console (Patch notes)."
          fi
      - name: Deploy the functions (login, manage-user, billing, ai, push, mail)
        if: steps.changed.outputs.run == 'true' && env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_ID != ''
        run: |
          set -o pipefail
          for fn in login manage-user billing ai push mail; do
            supabase functions deploy "$fn" --remote="$PROJECT_ID" --no-verify-jwt --use-api --yes 2>&1 | tee out.txt ||
              { echo "::error title=Function $fn::$(tail -c 1500 out.txt | tr '\n' ' ')"; exit 1; }
          done
      - name: Skipped
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.PROJECT_ID == ''
        run: echo "::notice::Supabase secrets not set yet — database step skipped (see docs/SUPABASE_SETUP.md)"

  # The desktop app: a Windows installer and a Mac app, offered on the website's "Get the app" page. They are the
  # connected app only — a small launcher that opens the website in its own window, like the phone apps. The offline
  # editions (the whole app inside) are not built here: this repository is public, so anything it publishes is too.
  # Build them on your own computer (pyinstaller packaging/beyond_erp.spec) and keep them private.
  # Only the BeyondERP Signer is built: the e-invoice helper for the computer the USB token is plugged into (a browser
  # cannot reach the token). The ERP itself is the browser app, installed from the browser; no desktop app is built.
  # Unsigned on purpose: Windows shows its "unknown publisher" notice once when it is installed.
  desktop:
    needs: test
    if: needs.test.outputs.desktop == 'true'
    continue-on-error: true
    runs-on: windows-latest
    permissions:
      contents: write   # publishes the Signer installer on the "desktop-app" release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: BeyondERP Signer
        shell: pwsh
        run: |
          pip install -r signer/requirements.txt pyinstaller pillow
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pyinstaller packaging/signer.spec --noconfirm --distpath dist-signer --workpath build-signer
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: BeyondERP Signer installer
        shell: pwsh
        run: |
          $v = (Select-String -Path signer/beyond_signer.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\signer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # On a GitHub release instead of the Actions artifact storage, which a private repository's free quota runs out of.
      - name: Publish the Signer installer on the desktop-app release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-app >/dev/null 2>&1 || gh release create desktop-app --prerelease \
            --title "BeyondERP Signer (latest build)" --notes "The e-invoice Signer for the computer with the USB token. Built from main; also offered in the app."
          gh release upload desktop-app dist-installer/BeyondERP-Signer-Setup.exe --clobber

  web:
    needs: [test, database, desktop]
    # the site still deploys when the database step fails (e.g. an outdated database password): the app works with an
    # older workspace and says what is missing, and the next database run catches up
    if: always() && needs.test.result == 'success' && needs.database.result != 'cancelled'
    runs-on: ubuntu-24.04
    env:
      BEYOND_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      BEYOND_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: .web-cache
          key: web-runtimes-${{ hashFiles('build_web.py') }}
      - name: Build the web app
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://mybeyonderp.com/' }}
        run: python build_web.py
      - name: Fetch the desktop installers built in this run
        if: needs.desktop.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download desktop-app -R "${{ github.repository }}" -D dl --clobber
      - name: Add the public downloads (the connected desktop app only)
        env:
          SITE: ${{ vars.SITE_URL || 'https://mybeyonderp.com/' }}
        run: python packaging/collect_downloads.py dl "$SITE"
      - name: Keep the site for GitHub Pages
        if: vars.USE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        continue-on-error: true
        with:
          path: web
          retention-days: 1
      - name: Create the Cloudflare Pages project (first deployment only)
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'beyond-erp' }}
        run: |
          if npx --yes wrangler@4 pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "Pages project $PROJECT exists"
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi
      - name: Publish to Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'beyond-erp' }} --branch=main

  pages:
    needs: web
    if: vars.USE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
